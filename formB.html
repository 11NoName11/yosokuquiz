<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Nihongo - Maru & Batsu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .anim-pop { animation: popIn 0.3s ease forwards; }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-[#EBF4F6] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl rounded-3xl shadow-xl p-6 md:p-8 border border-[#D0E8F2] relative">
        
        <!-- Header & Progress -->
        <div id="header-container" class="flex justify-between items-center mb-6 border-b border-[#EBF4F6] pb-4">
            <h1 class="text-lg font-bold text-[#2C3E50]">nihongo kuisu 🌸</h1>
            <span id="progress-text" class="text-sm font-semibold text-[#79A3B1] bg-[#F0F8FF] px-3 py-1 rounded-full">Soal 1 / 40</span>
        </div>

        <!-- Area Kuis Utama -->
        <div id="quiz-container" class="space-y-4">
            <div id="question-list" class="space-y-3"></div>
            <div class="flex items-center justify-between gap-3 pt-2 border-t border-[#EBF4F6] mt-2">
                <span id="progress-text" class="text-sm font-semibold text-[#79A3B1] bg-[#F0F8FF] px-3 py-1 rounded-full">0 / 40 terjawab</span>
                <button id="submit-btn" class="bg-[#4D96FF] hover:bg-[#3b82f6] text-white font-bold px-5 py-3 rounded-2xl shadow-md transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    Cek Hasil
                </button>
            </div>
        </div>

        <!-- Area Hasil Akhir & Rekap -->
        <div id="result-container" class="hidden anim-pop">
            <div class="text-center mb-6">
                <div class="text-5xl mb-2">🎉</div>
                <h2 class="text-2xl font-bold text-[#2C3E50]">Kuis Selesai!</h2>
                <p class="text-[#79A3B1] text-sm mt-1">Berikut adalah ringkasan hasil jawabanmu:</p>
                <div class="text-4xl font-black text-[#4D96FF] my-4" id="final-score">0 / 40</div>
                <button onclick="restartQuiz()" class="bg-[#4D96FF] hover:bg-[#3b82f6] text-white font-bold px-8 py-3 rounded-2xl shadow-md transition-all cursor-pointer">
                    Ulangi Kuis (Soal Diacak Ulang) 🔄
                </button>
            </div>

            <!-- Detail Review Jawaban -->
            <h3 class="font-bold text-[#2C3E50] mb-3 text-sm border-t border-[#EBF4F6] pt-4">Detail Jawaban:</h3>
            <div id="review-list" class="space-y-3 max-h-[350px] overflow-y-auto pr-2"></div>
        </div>

    </div>

    <script>
        // Data 40 Soal Baru (isFalse: true = Batsu, isFalse: false = Maru)
        const rawQuizData = [
            { q: "2017ねんにおけるにほんのようしょくせいさんりょうは、ぎょぎょうそうせいさんりょうの1/4をしめ、じゅうようなさんぎょうとなっている。", isFalse: false },
            { q: "むきゅうじようしょくとは、てんねんのみずのなかのえさをりようしてようしょくするほうほうである。", isFalse: false },
            { q: "ようしょくぎほうしゃは、くにのほうりつにしたがってめんきょがひつようである。", isFalse: false },
            { q: "ようしょくとは、ひとのてでかんりできるしせつのなかにしゅびょうをいれてしょうひんサイズにそだてるほうほうである。", isFalse: false },
            { q: "くるまえびのようしょくでは、じんこうしゅびょうがつかわれる。", isFalse: false },
            { q: "うなぎのようしょくでは、じんこうしゅびょうがつかわれる。", isFalse: true },
            { q: "さかながせいちょうすると、ちいさいときとくらべてしにくくなる。", isFalse: false },
            { q: "つぎのずは、ロープをいかりにむすびつけるいかりむすびである。", isFalse: false },
            { q: "つぎのずは、むすびめがほどけにくく、あみをあむときにつかうかえるまたである。", isFalse: false },
            { q: "だいおきしんやすいきん、かどみうむはひとにひがいをあたえる。", isFalse: false },
            { q: "ふえすぎたとくていのしょくぶつプランクトンが、げんいんですいちゅうのさんそがへる。", isFalse: false },
            { q: "がいこくでしにんがおこっても、にほんにつなみがやってくることはない。", isFalse: true },
            { q: "2017ねんにおけるにほんのぎょるいようしょくのせいさんりょうは、ふぐがもっともおおく、つぎにひらめ、しまあじのじゅんである。", isFalse: true },
            { q: "ぶりやかんぱちのようしょくは、せいちょうにあわせて、いけすにいれるみつどをへんかさせる。", isFalse: false },
            { q: "ぶりやかんぱちのようしょくは、ういるすたいさくのワクチンせっしゅはしない。", isFalse: true },
            { q: "ようしょくされたぶりやかんぱちは、かつぎょでしょうひちにおくられることはない。", isFalse: true },
            { q: "ようしょくまだいは、すいおんが18ど（℃）いじょうになると、えさをたべなくなる。", isFalse: true },
            { q: "ようしょくまだいは、ようぞんさんそりょうがさがると、こうどうにへんかがある。", isFalse: false },
            { q: "ようしょくまだいは、ひやけしやすいので、ひよけをいけすにとりつける。", isFalse: false },
            { q: "ひとつのいけすにいれるさかなのかずは、さかなのせいちょうにあわせてふやす。", isFalse: true },
            { q: "ぎょるいようしょくでは、かんきょうをちょうせいして、てきなせいじゅくをうながして、しんぎょをようせいする。", isFalse: true },
            { q: "しんぎょこうは、さかなをすいそうにいれておいても、かってにさんらんすることはない。", isFalse: true },
            { q: "ようしょくようのはいごうしりょうには、ふくすうのせいほうがある。", isFalse: false },
            { q: "さかなのびょうきには、ちりょうほうやよぼうほうがある。", isFalse: false },
            { q: "いけすのなかでしんでしまったさかなはとりだす。", isFalse: false },
            { q: "あかしおは、ふゆのさむいじきにはっせいする。", isFalse: true },
            { q: "ほたてがいがようせい（ラーは）のときは、ほかのどうぶつからにげることができる。", isFalse: true },
            { q: "つぎのずのやじるし（→）はかくこうである。", isFalse: false },
            { q: "ほたてがいのちゅうちょうせんには、ぐりこーげんがふくまれている。", isFalse: true },
            { q: "ほたてがいようしょくにつかわれるさいびょうきをうみにいれるときは、いちどにすべてをいれる。", isFalse: true },
            { q: "ほたてがいようしょくのあみだなにいれるほたてがいのかずは、せいちょうにあわせていれるかずをかえる。", isFalse: true },
            { q: "ほたてがいのかいどくによって、ひとがしぬことがある。", isFalse: false },
            { q: "ほたてがいのかいどくは、かいがじぶんでどくをつくりだすことによっておきる。", isFalse: true },
            { q: "2017ねんにおけるにほんのかいるいようしょくのすべては、まがきようしょくである。", isFalse: true },
            { q: "ようしょくしているまがきは、2〜3ねんでやく10せんちめーとる（cm）にせいちょうする。", isFalse: false },
            { q: "まがきは、なつのさんらんまえ、めすはらんしを、おすはせいしをたくわえている。", isFalse: false },
            { q: "げんざいのまがきようしょくのしゅりゅうは、てんねんさいびょうである。", isFalse: false },
            { q: "まがきのようしょくほうほうのひとつに、いかだすいかしきがそんざいする。", isFalse: false },
            { q: "つぎのずのせいぶつは、まがきやようしょくしせつにふちゃくするせいぶつである。", isFalse: false },
            { q: "まがきをしゅっかするときは、ようしょくかいいきをしるす。", isFalse: false }
        ];

        let quizData = [];
        let score = 0;
        let userAnswers = [];

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initQuiz() {
            quizData = shuffleArray(rawQuizData).map((item) => ({
                ...item,
                userChoice: null
            }));
            score = 0;
            userAnswers = [];

            document.getElementById("quiz-container").classList.remove("hidden");
            document.getElementById("header-container").classList.remove("hidden");
            document.getElementById("result-container").classList.add("hidden");
            renderQuestions();
            updateProgress();
        }

        function renderQuestions() {
            const list = document.getElementById("question-list");
            list.innerHTML = "";

            quizData.forEach((item, index) => {
                const isSelectedTrue = item.userChoice === true;
                const isSelectedFalse = item.userChoice === false;

                const card = document.createElement("div");
                card.className = "bg-[#F0F8FF] rounded-2xl p-4 border border-[#D0E8F2]";
                card.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <div class="flex-1">
                            <div class="text-[10px] uppercase tracking-[0.2em] font-bold text-[#79A3B1] mb-2">Soal ${index + 1}</div>
                            <p class="text-sm md:text-base font-medium text-[#2C3E50] leading-relaxed">${item.q}</p>
                        </div>
                        <div class="flex gap-2 md:flex-col lg:flex-row shrink-0">
                            <button class="answer-btn ${isSelectedFalse ? 'bg-[#FF6B6B] text-white border-[#FF6B6B]' : 'bg-white text-[#FF6B6B] border-[#FF6B6B]'} border-2 font-bold px-4 py-2 rounded-xl transition-all duration-200 active:scale-95" data-index="${index}" data-choice="false">
                                ✕ Batsu
                            </button>
                            <button class="answer-btn ${isSelectedTrue ? 'bg-[#4D96FF] text-white border-[#4D96FF]' : 'bg-white text-[#4D96FF] border-[#4D96FF]'} border-2 font-bold px-4 py-2 rounded-xl transition-all duration-200 active:scale-95" data-index="${index}" data-choice="true">
                                ◯ Maru
                            </button>
                        </div>
                    </div>
                `;

                list.appendChild(card);
            });
        }

        function updateProgress() {
            const answered = quizData.filter((item) => item.userChoice !== null).length;
            const progressText = document.getElementById("progress-text");
            progressText.textContent = `${answered} / ${quizData.length} terjawab`;
            document.getElementById("submit-btn").disabled = answered !== quizData.length;
        }

        document.getElementById("question-list").addEventListener("click", (event) => {
            const button = event.target.closest(".answer-btn");
            if (!button) return;

            const index = Number(button.dataset.index);
            const userChoice = button.dataset.choice === "true";
            quizData[index].userChoice = userChoice;
            renderQuestions();
            updateProgress();
        });

        function submitQuiz() {
            const unanswered = quizData.some((item) => item.userChoice === null);
            if (unanswered) {
                alert("Jawab semua soal dulu sebelum cek hasil.");
                return;
            }

            score = quizData.reduce((total, item) => {
                const correctChoice = !item.isFalse;
                return total + (item.userChoice === correctChoice ? 1 : 0);
            }, 0);

            userAnswers = quizData.map((item) => ({
                question: item.q,
                userChoice: item.userChoice,
                correctChoice: !item.isFalse,
                isCorrect: item.userChoice === !item.isFalse
            }));

            showResult();
        }

        function showResult() {
            document.getElementById("quiz-container").classList.add("hidden");
            document.getElementById("header-container").classList.add("hidden");
            document.getElementById("result-container").classList.remove("hidden");
            document.getElementById("final-score").textContent = `${score} / ${quizData.length}`;

            const reviewList = document.getElementById("review-list");
            reviewList.innerHTML = "";

            userAnswers.forEach((item, index) => {
                const userSymbol = item.userChoice ? "◯ (Maru)" : "✕ (Batsu)";
                const correctSymbol = item.correctChoice ? "◯ (Maru)" : "✕ (Batsu)";

                const card = document.createElement("div");
                card.className = `p-3 rounded-2xl border text-sm ${item.isCorrect ? 'bg-[#F0F8FF] border-[#D0E8F2]' : 'bg-[#FFF5F5] border-[#FED7D7]'}`;

                card.innerHTML = `
                    <div class="font-semibold text-[#2C3E50] mb-1">Soal ${index + 1}: ${item.question}</div>
                    <div class="flex justify-between text-xs mt-2 gap-4">
                        <span class="${item.isCorrect ? 'text-blue-600 font-bold' : 'text-red-500 font-bold'}">
                            Jawabanmu: ${userSymbol} ${item.isCorrect ? '✓' : '✗'}
                        </span>
                        <span class="text-gray-500">Kunci: ${correctSymbol}</span>
                    </div>
                `;
                reviewList.appendChild(card);
            });
        }

        function restartQuiz() {
            initQuiz();
        }

        document.getElementById("submit-btn").addEventListener("click", submitQuiz);

        initQuiz();
    </script>
</body>
</html>
